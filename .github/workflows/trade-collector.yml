name: Tradeium AI Data Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [RESTART_BOT]

jobs:
  collect:
    name: Tradeium Veri Toplayıcı
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bağımlılıkları ve Tarayıcıyı Kur
        run: |
          pip install playwright colorama
          playwright install chromium
          playwright install-deps

      - name: Binomo Oturumunu Hazırla
        env:
          AUTH_JSON_DATA: ${{ secrets.BINOMO_AUTH_JSON }}
        run: |
          mkdir -p browser_data
          echo "$AUTH_JSON_DATA" > auth.json

      - name: Tradeium Veri Toplama Botunu Başlat
        env:
          MAX_RUN_TIME_SECONDS: 90
        run: |
          if [ ! -f "dataset.csv" ]; then
            touch dataset.csv
          fi

          timeout 21000 xvfb-run -a python -u collector.py 2>&1 | tee bot_output.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ] && [ $STATUS -ne 124 ]; then
            echo "Bot Hata ile Sonlandi: $STATUS"
            exit $STATUS
          fi

      - name: Log Dosyalarını Kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files-${{ github.run_number }}
          path: |
            bot_output.log
            crash.log
            debug_screenshots/
          if-no-files-found: warn
          retention-days: 3

      - name: Veri Setini Güncelle
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull --rebase origin main || git pull --rebase origin master || echo "Pull yapilamadi, devam ediliyor"
          git add dataset.csv
          git commit -m "Veri seti güncellendi [Otomatik]" || echo "Değişiklik yok"
          git push

      - name: Botu Yeniden Başlat
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "RESTART_BOT"}'
